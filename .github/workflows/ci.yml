name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build llmuxd
        run: npm run build --workspace @cordfuse/llmuxd

      - name: Build llmux
        run: npm run build --workspace @cordfuse/llmux

      - name: Smoke (--help)
        run: |
          node packages/llmuxd/dist/index.js --help
          node packages/llmux/dist/index.js --help
